name: Offline checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: roborsi-compile examples/three_objects.json --speed 2 --tcp-floor 0 --output /tmp/stream.json
      - run: python scripts/verify_evidence.py
