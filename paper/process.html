<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboRSI · 全量过程浏览</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172b45;font:16px/1.6 system-ui}main{max-width:1260px;margin:auto;padding:32px 24px}a{color:#087f78}p{color:#52647b}.eyebrow{color:#087f78;letter-spacing:2px;font-size:13px}h1{margin:8px 0;font-size:34px}section{background:#ffffff;border:1px solid #dce4ee;border-radius:12px;padding:18px;margin:18px 0}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{background:#edf2f8;color:#172b45;border:1px solid #b7c6d8;border-radius:6px;padding:8px 12px}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}canvas{width:100%;height:auto;background:#f8fafc;border-radius:8px}input[type=range]{flex:1;min-width:180px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,monospace}#status{color:#b65b12}.note{border-left:3px solid #b65b12;padding:8px 16px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:16px}}
html.embedded main{padding:4px 0;max-width:none}html.embedded main>h1,html.embedded main>.eyebrow,html.embedded main>.row:first-child,html.embedded footer{display:none}</style><main><div class="eyebrow">ROBORSI / FULL PROCESS ARCHIVE</div><h1>每个 episode，每个 5 ms</h1>
<p><a href="index.html">← 论文实验页</a> · 直接读取已归档的过程文件，可切换全部种子和方法。</p><p class="note">数据是自由 Cartesian 夹爪的运动学状态；不是 Piper 关节反馈、真实接触仿真或学习模型输出。</p>
<section><p id="status">正在载入、解压过程文件…</p><div class="controls"><label>场景 <select id="scenario"></select></label><label>方法 <select id="method"></select></label><label>seed <select id="seed"></select></label><button id="download" disabled>下载本 episode CSV</button></div></section>
<div class="grid"><section><h3>桌面轨迹 / m</h3><canvas id="xy" width="560" height="340"></canvas><p>青色：物体；橙色：夹爪；紫色：当前 XY 目标；蓝框：篮筐。</p></section><section><h3>高度过程 / m</h3><canvas id="height" width="560" height="340"></canvas><p>橙色：夹爪 Z；青色：物体 Z；白线：当前时刻。</p></section></div>
<section><div class="controls"><button id="play">播放</button><button id="step">单步 5 ms</button><input id="time" type="range" min="0" value="0" step="1" aria-label="过程时间轴"><label>速度 <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label><span id="clock"></span></div></section>
<div class="grid"><section><h3>当前状态与版本</h3><pre id="state"></pre></section><section><h3>截至此刻的观察与决策</h3><pre id="events"></pre></section></div>
<details><summary>episode 结果与证据来源</summary><pre id="meta"></pre></details></main><script>if(new URLSearchParams(location.search).has("embed"))document.documentElement.classList.add("embedded");
const $=s=>document.querySelector(s),methods={fixed_plan:'固定粗计划',instant_rules:'即时规则',delayed_unchecked:'延迟 / 不复查',delayed_checked:'延迟 / 版本复查'};let records=new Map(),data,current,episode,playing=false,last=0,fraction=0;
const params=new URLSearchParams(location.search),base=new URL(params.get('run')||'../experiments/simulation/2026-09-22/run_001/',location.href);
function choice(id,values,label){for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=label?label(value):value;$(id).append(o)}}
function select(){playing=false;$('#play').textContent='播放';episode=data.episodes.find(e=>e.scenario===$('#scenario').value&&e.method===$('#method').value&&e.seed===+$('#seed').value);current=records.get(episode.episode_id);$('#time').max=current.samples.length-1;$('#time').value=0;const {events,frames,...rest}=episode;$('#meta').textContent=JSON.stringify({run:base.pathname,benchmark_sha256:data.artifact_sha256,...rest},null,2);draw()}
function draw(){if(!current)return;const i=+$('#time').value,r=current.samples[i],columns=current.columns,s=Object.fromEntries(columns.map((key,j)=>[key,r[j]]));s.phase=current.phases[s.phase_index];$('#state').textContent=JSON.stringify(s,null,2);$('#clock').textContent=r[0].toFixed(3)+' s / '+episode.simulated_duration_s.toFixed(3)+' s';$('#events').textContent=episode.events.filter(e=>e.t<=r[0]).map(e=>JSON.stringify(e)).join('\n');
let g=$('#xy').getContext('2d');g.clearRect(0,0,560,340);const xy=(x,y)=>[40+(x+.35)/.7*480,300-(y+.2)/.4*260];g.strokeStyle='#233a55';for(let k=0;k<=6;k++){g.beginPath();g.moveTo(40+k*80,35);g.lineTo(40+k*80,300);g.stroke()}g.strokeStyle='#699ce5';const b=xy(.16,.135),b2=xy(.24,.065);g.strokeRect(...b,b2[0]-b[0],b2[1]-b[1]);g.strokeStyle='#b65b1270';g.beginPath();for(let j=0;j<=i;j+=4){const p=xy(current.samples[j][1],current.samples[j][2]);j?g.lineTo(...p):g.moveTo(...p)}g.stroke();let p=xy(r[4],r[5]);g.fillStyle='#087f78';g.beginPath();g.ellipse(...p,10,7,0,0,Math.PI*2);g.fill();p=xy(r[1],r[2]);g.strokeStyle='#b65b12';g.lineWidth=3;const w=r[9]?7:16;g.beginPath();g.moveTo(p[0]-w,p[1]+12);g.lineTo(p[0]-w,p[1]-12);g.lineTo(p[0]+w,p[1]-12);g.lineTo(p[0]+w,p[1]+12);g.stroke();g.lineWidth=1;p=xy(r[7],r[8]);g.strokeStyle='#7852b0';g.strokeRect(p[0]-5,p[1]-5,10,10);g.fillStyle='#52647b';g.font='13px system-ui';g.fillText('x / m   -0.35                                     0.35',35,325);
g=$('#height').getContext('2d');g.clearRect(0,0,560,340);g.strokeStyle='#233a55';g.beginPath();g.moveTo(35,40);g.lineTo(35,295);g.lineTo(525,295);g.stroke();for(const [column,color] of [[3,'#b65b12'],[6,'#087f78']]){g.strokeStyle=color;g.beginPath();for(let j=0;j<current.samples.length;j+=3){const row=current.samples[j],x=35+row[0]/episode.simulated_duration_s*490,y=295-row[column]/.25*250;j?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}g.strokeStyle='#172b45';const x=35+r[0]/episode.simulated_duration_s*490;g.beginPath();g.moveTo(x,40);g.lineTo(x,295);g.stroke();g.fillStyle='#52647b';g.font='13px system-ui';g.fillText('0.25 m',6,28);g.fillText('0',15,300);g.fillText('time / s',460,320)}
for(const id of ['#scenario','#method','#seed'])$(id).onchange=select;$('#time').oninput=()=>{fraction=0;draw()};$('#step').onclick=()=>{$('#time').value=Math.min(current.samples.length-1,+$('#time').value+1);draw()};$('#play').onclick=()=>{if(!current)return;playing=!playing;if(playing&&+$('#time').value>=current.samples.length-1)$('#time').value=0;$('#play').textContent=playing?'暂停':'播放'};
function animate(now){if(playing&&last){fraction+=(now-last)/1000*200*+$('#speed').value;const advance=Math.floor(fraction);fraction-=advance;$('#time').value=Math.min(current.samples.length-1,+$('#time').value+advance);draw();if(+$('#time').value>=current.samples.length-1){playing=false;$('#play').textContent='播放'}}last=now;requestAnimationFrame(animate)}requestAnimationFrame(animate);
$('#download').onclick=()=>{const content=[current.columns.join(','),...current.samples.map(r=>r.join(','))].join('\n'),url=URL.createObjectURL(new Blob([content],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download=episode.episode_id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
(async()=>{try{if(base.origin!==location.origin||!base.pathname.includes('/experiments/simulation/'))throw Error('只允许读取本机实验归档');const response=await fetch(new URL('benchmark.json',base));if(!response.ok)throw Error('读取 benchmark 失败');data=await response.json();const raw=await fetch(new URL('process.jsonl.gz',base));if(!raw.ok)throw Error('读取过程文件失败');const content=await new Response(raw.body.pipeThrough(new DecompressionStream('gzip'))).text();for(const line of content.trim().split('\n')){const row=JSON.parse(line);records.set(row.episode_id,row)}choice('#scenario',data.config.scenarios);choice('#method',data.config.methods,m=>methods[m]);choice('#seed',[...new Set(data.episodes.map(e=>e.seed))]);$('#scenario').value='shift_during_wait';$('#method').value='delayed_checked';$('#status').textContent=`已载入 ${records.size} 个 episode / ${data.process_log.samples.toLocaleString()} 个状态 · 200 Hz 虚拟采样` ;$('#download').disabled=false;select();document.body.dataset.loaded='true'}catch(error){$('#status').textContent='载入失败：'+error.message+'。请通过本机 HTTP 服务打开，不要使用 file://。';document.body.dataset.error='true'}})();
</script></html>
